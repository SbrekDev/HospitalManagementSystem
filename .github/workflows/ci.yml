name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/SanatorioHMS.sln

      - name: Build
        run: dotnet build src/SanatorioHMS.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format src/SanatorioHMS.sln --verify-no-changes --no-restore

      - name: Test with coverage
        run: >-
          $coverageRoot = Join-Path $PWD ("TestResults\run-{0}" -f (Get-Date -Format 'yyyyMMddHHmmssfff'));
          New-Item -ItemType Directory -Path $coverageRoot -Force | Out-Null;
          "COVERAGE_RESULTS_DIRECTORY=$coverageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;
          dotnet test src/SanatorioHMS.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          --results-directory $coverageRoot

      - name: Enforce stratified project coverage
        shell: pwsh
        run: |
          [System.Collections.Generic.Dictionary[string, int]]$thresholds = @{
            'SanatorioHMS.Domain.Core' = 60
            'SanatorioHMS.Domain.Scheduling' = 60
            'SanatorioHMS.Domain.ClinicalCare' = 60
            'SanatorioHMS.Domain.Diagnostics' = 60
            'SanatorioHMS.Domain.Auth' = 60
            'SanatorioHMS.Domain.PatientRegistry' = 60
            'SanatorioHMS.Application.Core' = 80
            'SanatorioHMS.Application.Scheduling' = 80
            'SanatorioHMS.Application.ClinicalCare' = 80
            'SanatorioHMS.Application.Diagnostics' = 80
            'SanatorioHMS.Application.Auth' = 80
            'SanatorioHMS.Application.PatientRegistry' = 80
            'SanatorioHMS.Api' = 65
            'SanatorioHMS.Api.Client' = 65
            'SanatorioHMS.Desktop' = 40
          }

          $coverageRoot = $env:COVERAGE_RESULTS_DIRECTORY
          if ([string]::IsNullOrWhiteSpace($coverageRoot) -or -not (Test-Path -LiteralPath $coverageRoot)) {
            throw 'The current run coverage directory was not found.'
          }

          $reports = Get-ChildItem -Path $coverageRoot -Filter coverage.cobertura.xml -Recurse -File
          if ($reports.Count -eq 0) {
            throw "No Cobertura report found under $coverageRoot."
          }

          # A source line can occur in every test project's report. Keep one
          # entry per product project, source filename, and line number, and
          # treat it as covered when any report records hits for that line.
          $lines = @{}
          foreach ($project in $thresholds.Keys) {
            $lines[$project] = @{}
          }

          foreach ($report in $reports) {
            [xml]$xml = Get-Content -LiteralPath $report.FullName
            foreach ($class in $xml.SelectNodes('//class')) {
              $identity = "{0} {1}" -f $class.package, $class.filename
              $project = $thresholds.Keys |
                Where-Object { $identity -match [regex]::Escape($_) } |
                Sort-Object Length -Descending |
                Select-Object -First 1
              if (-not $project) { continue }

              foreach ($line in $class.SelectNodes('./lines/line')) {
                $filename = ([string]$class.filename).Trim().Replace('\', '/').ToLowerInvariant()
                $lineNumber = [int]$line.number
                $key = "{0}|{1}|{2}" -f $project, $filename, $lineNumber
                $covered = [int]$line.hits -gt 0
                if (-not $lines[$project].ContainsKey($key)) {
                  $lines[$project][$key] = $covered
                } elseif ($covered) {
                  $lines[$project][$key] = $true
                }
              }
            }
          }

          $failed = $false
          foreach ($project in $thresholds.Keys | Sort-Object) {
            $projectLines = @($lines[$project].Values)
            $total = $projectLines.Count
            $covered = @($projectLines | Where-Object { $_ -eq $true }).Count
            $percent = if ($total -gt 0) { 100 * $covered / $total } else { 0 }
            $threshold = $thresholds[$project]
            $status = if ($percent -ge $threshold) { 'PASS' } else { 'FAIL' }
            Write-Host ("{0}: {1} ({2}/{3}), threshold {4}% [{5}]" -f $project, $percent.ToString('F2'), $covered, $total, $threshold, $status)
            if ($percent -lt $threshold) { $failed = $true }
          }

          if ($failed) {
            throw 'One or more project coverage thresholds were not met.'
          }

      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
          if-no-files-found: ignore
