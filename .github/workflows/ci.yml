name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/SanatorioHMS.sln

      - name: Build
        run: dotnet build src/SanatorioHMS.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format src/SanatorioHMS.sln --verify-no-changes --no-restore

      - name: Test with coverage
        run: >-
          dotnet test src/SanatorioHMS.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          --results-directory ./TestResults

      - name: Enforce 80 percent line coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('No Cobertura report found', file=sys.stderr); sys.exit(1)
          covered = total = 0
          for path in files:
              root = ET.parse(path).getroot()
              covered += float(root.attrib.get('lines-covered', 0))
              total += float(root.attrib.get('lines-valid', 0))
          percent = 100 * covered / total if total else 0
          print(f'Cobertura line coverage: {percent:.2f}% ({covered:.0f}/{total:.0f})')
          sys.exit(0 if percent >= 80 else 1)
          PY

      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
          if-no-files-found: ignore
