name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/SanatorioHMS.sln

      - name: Build
        run: dotnet build src/SanatorioHMS.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format src/SanatorioHMS.sln --verify-no-changes --no-restore

      - name: Test with coverage
        run: >-
          dotnet test src/SanatorioHMS.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
          if-no-files-found: ignore
