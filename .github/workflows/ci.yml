name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/SanatorioHMS.sln

      - name: Build
        run: dotnet build src/SanatorioHMS.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format src/SanatorioHMS.sln --verify-no-changes --no-restore

      - name: Test with coverage
        run: >-
          dotnet test src/SanatorioHMS.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          --results-directory ./TestResults

      - name: Enforce stratified project coverage
        shell: pwsh
        run: |
          [System.Collections.Generic.Dictionary[string, int]]$thresholds = @{
            'SanatorioHMS.Domain.Core' = 75
            'SanatorioHMS.Domain.Scheduling' = 85
            'SanatorioHMS.Domain.ClinicalCare' = 85
            'SanatorioHMS.Domain.Diagnostics' = 85
            'SanatorioHMS.Domain.Auth' = 85
            'SanatorioHMS.Domain.PatientRegistry' = 85
            'SanatorioHMS.Application.Core' = 80
            'SanatorioHMS.Application.Scheduling' = 80
            'SanatorioHMS.Application.ClinicalCare' = 80
            'SanatorioHMS.Application.Diagnostics' = 80
            'SanatorioHMS.Application.Auth' = 80
            'SanatorioHMS.Application.PatientRegistry' = 80
            'SanatorioHMS.Api' = 65
            'SanatorioHMS.Api.Client' = 65
            'SanatorioHMS.Desktop' = 40
          }

          $reports = Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse -File
          if ($reports.Count -eq 0) {
            throw 'No Cobertura report found under TestResults.'
          }

          $coverage = @{}
          foreach ($project in $thresholds.Keys) {
            $coverage[$project] = @{ Covered = 0; Total = 0 }
          }

          foreach ($report in $reports) {
            [xml]$xml = Get-Content -LiteralPath $report.FullName
            foreach ($class in $xml.SelectNodes('//class')) {
              $identity = "{0} {1}" -f $class.package, $class.filename
              $project = $thresholds.Keys |
                Where-Object { $identity -match [regex]::Escape($_) } |
                Sort-Object Length -Descending |
                Select-Object -First 1
              if (-not $project) { continue }

              foreach ($line in $class.SelectNodes('./lines/line')) {
                $coverage[$project].Total++
                if ([int]$line.hits -gt 0) { $coverage[$project].Covered++ }
              }
            }
          }

          $failed = $false
          foreach ($project in $thresholds.Keys | Sort-Object) {
            $result = $coverage[$project]
            $percent = if ($result.Total -gt 0) { 100 * $result.Covered / $result.Total } else { 0 }
            $threshold = $thresholds[$project]
            $status = if ($percent -ge $threshold) { 'PASS' } else { 'FAIL' }
            Write-Host ("{0}: {1} ({2}/{3}), threshold {4}% [{5}]" -f $project, $percent.ToString('F2'), $result.Covered, $result.Total, $threshold, $status)
            if ($percent -lt $threshold) { $failed = $true }
          }

          if ($failed) {
            throw 'One or more project coverage thresholds were not met.'
          }

      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
          if-no-files-found: ignore
